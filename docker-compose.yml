services:
  db:
    image: pgvector/pgvector:pg17
    container_name: context-search-db
    restart: unless-stopped

    environment:
      POSTGRES_URL: monirath
      POSTGRES_PASSWORD: password
      POSTGRES_DB: context_search_db

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
