services:
  db:
    image: pgvector/pgvector:pg17
    container_name: context-search-db
    restart: unless-stopped

    environment:
      POSTGRES_URL: ${POSTGRES_URL}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
